name: lexmory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0-rc.1+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_animate: ^4.5.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.2.3
  flutter_native_splash: ^2.4.4
  google_mobile_ads: ^9.0.0
  intl: ^0.20.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon/app_icon.png"
  adaptive_icon_background: "#0F0F10"
  adaptive_icon_foreground: "lib/assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/icon/native_splash.png
