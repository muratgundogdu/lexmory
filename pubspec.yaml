    - lib/assets/library/room_02/
    - lib/assets/library/room_03/
    - lib/assets/library/room_04/
    - lib/assets/library/room_05/
    - lib/assets/library/room_06/
    - lib/assets/library/room_07/
    - lib/assets/library/room_08/
    - lib/assets/library/room_09/
    - lib/assets/library/room_10/
    - lib/assets/library/room_11/
    - lib/assets/library/room_12/
    - lib/assets/library/room_13/
    - lib/assets/library/room_14/
    - lib/assets/library/room_15/
    - lib/assets/cards/
    - lib/assets/chests/
    - lib/assets/cards/bilge_amca/
    - lib/assets/cards/kutuphane_kedisi/
    - lib/assets/cards/akademi_baykusu/
    - lib/assets/cards/zaman_bekcisi/
    - lib/assets/cards/gizemli_koleksiyoncu/
